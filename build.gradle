plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id "com.netflix.dgs.codegen" version '6.3.0'
    id("com.netflix.nebula.ospackage") version "11.9.1"
    id "application"
    id "jacoco"
}

ext {
    sd_build = Integer.parseInt(System.env['SD_BUILD'] ?: '0')
    sd_pull_request = Integer.parseInt(System.env['SD_PULL_REQUEST'] ?: '0')
    minor_version = System.getenv('SCREWDRIVER') ? (sd_pull_request <= 0 ? 5 : 4) : 3
    git_tag_version = System.getenv('GIT_TAG_VERSION')
    commonVersion = git_tag_version ? git_tag_version.replace('v', '') : "1.${minor_version}.${sd_pull_request}.${sd_build}"
    product_release = System.getenv('SD_BUILD') ?: '1'
    pkg_prefix = '/opt/y/1.0'
    distribution_version = 'el7'
    build_distributions_path = 'build/distributions/'
    build_install_path = 'build/install'
    auto_publish_dir = System.getenv('AUTO_PUBLISH_DIR') ?: '/dev/null'
    package_type_to_include = "subgraph-server-jarvis-*.rpm"
    athenzVersion = '1.12.3'
    lombokVersion = '1.18.36'
    micrometerVersion = '1.4.1'
    micrometerOtelVersion = '1.3.5'
    ncgCommonVersion = '0.1.2'
    httpClientVersion = '5.4.1'
    httpCoreVersion = '5.3.1'
    springBootVersion = '3.3.5'
    springGraphqlVersion = '1.3.3'
}

plugins.withId('nebula.ospackage') {
    afterEvaluate {
        project.task('publishRpm', dependsOn: 'buildRpm') { task ->
            doLast {
                def dryrun = DryRunHelper.dryrun(task, project.files('sd-cmd'))
                fileTree("${project.buildDir}/distributions/").matching {
                    include package_type_to_include
                }.each { File rpm ->
                    exec {
                        commandLine = ['sd-cmd', 'exec', 'dhrainbow/publish-rpm@latest',
                                       "--os=noarch", "--arch=noarch", "--repo=media-be-rpms/rhel", rpm]
                        logger.lifecycle('publishRpm task {}', commandLine)
                        if (dryrun) {
                            commandLine = ['echo'] + commandLine
                        }
                    }
                }
            }
        }
    }
}

mainClassName = 'com.yahoo.media.ncg.jarvis.graphql.SubgraphServer'

group = 'com.yahoo.media'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
//    maven { url 'https://edge.artifactory.ouroath.com:4443/artifactory/remote-repos' }
//    maven { url 'https://edge.artifactory.ouroath.com:4443/artifactory/core-tech-maven-release' }
//    maven { url 'https://edge.artifactory.ouroath.com:4443/artifactory/java-platform-maven-release' }
//    maven { url 'https://edge.artifactory.ouroath.com:4443/artifactory/ncg_release' }
}

dependencyManagement {
    imports {
        mavenBom("com.netflix.graphql.dgs:graphql-dgs-platform-dependencies:10.0.3")
        mavenBom("io.micrometer:micrometer-tracing-bom:$micrometerVersion")
    }
}

dependencies {
//    implementation "com.yahoo.media.ncg:ncg-common-lib:$ncgCommonVersion"

    implementation "com.netflix.graphql.dgs:graphql-dgs-extended-scalars"
    implementation "com.netflix.graphql.dgs:graphql-dgs-client"
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-micrometer'
    implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion") {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation "com.netflix.graphql.dgs:dgs-starter"
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-jetty'
    //implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.apache.httpcomponents.client5:httpclient5:$httpClientVersion"
    implementation "org.apache.httpcomponents.core5:httpcore5:$httpCoreVersion"
    implementation "org.apache.httpcomponents.core5:httpcore5-reactive:$httpCoreVersion"
    implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    implementation "com.yahoo.athenz:athenz-cert-refresher:$athenzVersion"
    implementation "com.yahoo.athenz:athenz-zts-java-client:$athenzVersion"

    // https://spring.io/blog/2022/10/12/observability-with-spring-boot-3
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.micrometer:micrometer-observation'
    implementation 'io.micrometer:micrometer-registry-otlp'
    implementation 'io.micrometer:micrometer-tracing'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    // micrometer-tracing-bridge-otel needs opentelemetry-exporter-otlp to actually export the spans
    // to the otel collector.
    // https://docs.spring.io/spring-boot/reference/actuator/tracing.html#actuator.micrometer-tracing.tracer-implementations.otel-otlp
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    implementation 'com.google.protobuf:protobuf-java:4.28.3'
    implementation 'com.apollographql.federation:federation-graphql-java-support'

    runtimeOnly('org.slf4j:jcl-over-slf4j:2.0.13')
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:$springBootVersion"
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.springframework.graphql:spring-graphql-test:$springGraphqlVersion"
    testImplementation "org.springframework.boot:spring-boot-starter-test:$springBootVersion"
//    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'io.projectreactor:reactor-test'
}

bootJar {
    mainClassName = 'com.yahoo.media.ncg.jarvis.graphql.SubgraphServer'
    launchScript()
}
assemble.dependsOn(bootJar)

ospackage {
    packageName = "subgraph-server-jarvis"
    version = commonVersion
    distribution = distribution_version.toString()
    release = "${product_release}.${distribution_version}"
    prefix pkg_prefix
    os = "LINUX"
    user "appuser"

    into pkg_prefix
    from(bootJar.outputs.files) {
        into "share/${packageName}/lib"
    }

    from(bootStartScripts.outputs.files) {
        exclude "*.bat"
        into "share/${packageName}/bin"
    }
}

generateJava {
    schemaPaths = ["${projectDir}/src/main/resources/schema"]
    packageName = 'com.yahoo.media.ncg.jarvis.graphql.generated'
    generateClient = true
    generateBoxedTypes = true
    typeMapping = [
            "PaginationToken": "java.lang.String"
    ]
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }

    afterEvaluate {
        excludeClassFilesForReport(classDirectories)
    }
}

private excludeClassFilesForReport(classDirectories) {
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(
                dir: it,
                exclude: [
                        "**/com/yahoo/media/ncg/jarvis/graphql/generated/**",
                        "**/com/yahoo/media/ncg/jarvis/graphql/SubgraphServer.class",
                        "**/com/yahoo/media/ncg/jarvis/graphql/utils/ContentUtilsV2.class"
                ]
        )
    }))
}

