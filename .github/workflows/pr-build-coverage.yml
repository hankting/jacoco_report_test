permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

jobs:
  build-deploy:
#    runs-on: yahoo-enterprise-ubuntu-x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build rpm and test
        shell: bash
        run: |
          if [ -f "build.gradle" ]; then
             ./gradlew clean build
          fi

      - name: Check code diff
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }} repo=${{github.repository}} pr=${{github.event.pull_request.number}} before=${{ github.event.before }} after=${{ github.event.after }} head_sha=${{ github.event.pull_request.head.sha }} base_sha=${{ github.event.pull_request.base.sha }} sha=${{ github.sha }}"
          echo "run git diff, base_ref=${GITHUB_BASE_REF}, head_ref=${GITHUB_HEAD_REF}"
          git fetch origin --depth=1
          git diff --name-only origin/${GITHUB_BASE_REF} origin/${GITHUB_HEAD_REF}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "${{ github.workspace }}/build/reports/jacoco/test/html/"

      - name: Add coverage to PR
        id: jacoco
        #uses: madrapps/jacoco-report@v1.7.1
        uses: ALonelyDuck/jacoco-report@v1.2
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ github.token }}
          min-coverage-overall: 0
          min-coverage-changed-files: 80
          continue-on-error: false
          skip-if-no-changes: false
          title: '# Jacoco Coverage Report'
          pass-emoji: ':green_circle:'
          fail-emoji: ':red_circle:'
          update-comment: false

      - name: Log coverage percentage
        run: |
          echo "Total coverage ${{ steps.jacoco.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.jacoco.outputs.coverage-changed-files }}"
          echo "Changed Lines coverage ${{ steps.jacoco.outputs.coverage-changed-percentage }}"

#      - name: Fail PR if overall coverage is less than threshold
#        if: ${{ steps.jacoco.outputs.coverage-overall < 50 }}
#        uses: actions/github-script@v6
#        with:
#          script: |
#            core.setFailed("Overall coverage is less than 50!");

      - name: Fail PR if changed lines coverage is less than threshold
        if: ${{ steps.jacoco.outputs.coverage-changed-percentage < 80 }}
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed("Changed lines coverage is less than 80!");
