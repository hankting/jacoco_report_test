name: pr-build-deploy

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write
  pull-requests: write

jobs:
  build-deploy:
    runs-on: yahoo-enterprise-ubuntu-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Publish Coverage Report as PR Comment
        uses: dorny/test-reporter@v1
        with:
          name: Jacoco Coverage Report
          path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          reporter: java-jacoco
          token: ${{ github.token }}